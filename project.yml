name: Zugzaehler
options:
  bundleIdPrefix: com.zugzaehler
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Zugzaehler:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - target: ZugzaehlerWidget
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Zugzähler
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.application-groups: [group.com.zugzaehler.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zugzaehler.app
  ZugzaehlerWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Zugzähler
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.zugzaehler.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zugzaehler.app.widget
