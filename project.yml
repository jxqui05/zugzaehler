name: Zugzaehler
options:
  bundleIdPrefix: com.zugzaehler
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Zugzaehler:
    type: application
    platform: iOS
    sources: [ZugzaehlerApp.swift, Shared.swift]
    dependencies:
      - target: ZugzaehlerWidget
    info:
      path: Info-App.plist
      properties:
        CFBundleDisplayName: Zugzähler
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: App.entitlements
      properties:
        com.apple.security.application-groups: [group.com.zugzaehler.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zugzaehler.app
  ZugzaehlerWidget:
    type: app-extension
    platform: iOS
    sources: [ZugzaehlerWidget.swift, Shared.swift]
    info:
      path: Info-Widget.plist
      properties:
        CFBundleDisplayName: Zugzähler
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.zugzaehler.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zugzaehler.app.widget
